databaseChangeLog:
  - changeSet:
      id: 002-create-cars-table
      author: Hot00Tea
      changes:
        - createTable:
            tableName: cars
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: model
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: brand
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: inventory
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: daily_fee
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false